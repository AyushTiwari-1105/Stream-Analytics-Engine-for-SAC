spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/user
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  api:
    security:
      admin-key: "admin-secret-key-999"
      publisher-key: "file-server-secret-key-123"